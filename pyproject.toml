[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "manual-spss"
version = "0.1.0"
description = "Manual interactivo de consulta y aprendizaje de SPSS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyQt6>=6.7,<6.12"]

[project.scripts]
manual-spss = "manual_spss.app:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
manual_spss = ["ui/assets/*.png", "ui/assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "unit: pruebas unitarias aisladas",
    "integration: pruebas de integración con archivos locales",
]

[tool.coverage.run]
branch = true
source = ["manual_spss"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["manual_spss"]
